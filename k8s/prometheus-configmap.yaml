apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: lab8
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    scrape_configs:
      - job_name: "gateway"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["api-gateway:8000"]
            labels:
              service: "api-gateway"
              app: "campusconnect"

      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]
