apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: lab8
  labels:
    app: order-service
    app.kubernetes.io/name: order-service
    app.kubernetes.io/component: microservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: ghcr.io/akshay111962/order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3003
              name: http
          env:
            - name: ORDER_SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: campusconnect-config
                  key: ORDER_SERVICE_PORT
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: campusconnect-config
                  key: ORDER_SERVICE_PORT
            - name: USER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: campusconnect-config
                  key: USER_SERVICE_URL
            - name: PRODUCT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: campusconnect-config
                  key: PRODUCT_SERVICE_URL
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: campusconnect-secrets
                  key: MONGO_URI
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
