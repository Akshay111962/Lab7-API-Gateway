services:
  # ─── API Gateway (Public Single Entry Point — Lab 7) ─────────────────────────
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      USER_SERVICE_URL: http://user-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
      ORDER_SERVICE_URL: http://order-service:3003
    depends_on:
      - user-service
      - product-service
      - order-service
    networks:
      - campus-network
    restart: unless-stopped

  # ─── User Microservice (Internal Docker Network Only) ────────────────────────
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    expose:
      - "3001"
    environment:
      PORT: 3001
      USER_SERVICE_PORT: 3001
      MONGO_URI: mongodb://mongodb:27017/campusconnect_users
    depends_on:
      - mongodb
    networks:
      - campus-network
    restart: unless-stopped

  # ─── Product Microservice (Internal Docker Network Only) ─────────────────────
  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: product-service
    expose:
      - "3002"
    environment:
      PORT: 3002
      PRODUCT_SERVICE_PORT: 3002
      MONGO_URI: mongodb://mongodb:27017/campusconnect_products
    depends_on:
      - mongodb
    networks:
      - campus-network
    restart: unless-stopped

  # ─── Order Microservice (Internal Docker Network Only) ───────────────────────
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    expose:
      - "3003"
    environment:
      PORT: 3003
      ORDER_SERVICE_PORT: 3003
      USER_SERVICE_URL: http://user-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
      MONGO_URI: mongodb://mongodb:27017/campusconnect_orders
    depends_on:
      - mongodb
      - user-service
      - product-service
    networks:
      - campus-network
    restart: unless-stopped

  # ─── Shared Database Engine (Database per Service pattern) ────────────────────
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - campus-mongo-data:/data/db
    networks:
      - campus-network
    restart: unless-stopped

networks:
  campus-network:
    name: campus-network

volumes:
  campus-mongo-data:
    name: campus-mongo-data
